name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: Migrations apply to an empty database
        # The suite builds its schema with create_all, so nothing else would
        # catch a migration that is broken or missing a model change.
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: No model changes missing from migrations
        # Fails if the models have drifted from the migration history, which is
        # otherwise only discovered when a deploy rebuilds the schema.
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
